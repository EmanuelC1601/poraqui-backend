name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Poraqui.sln
      - name: Build
        run: dotnet build Poraqui.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Poraqui.sln --configuration Release --no-build --no-restore
      - name: Publish IIS package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/Poraqui.Api/Poraqui.Api.csproj --configuration Release --no-restore --output "${RUNNER_TEMP}/poraqui-api-iis"
      - name: Upload IIS package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: poraqui-api-iis-${{ github.sha }}
          path: ${{ runner.temp }}/poraqui-api-iis/
          if-no-files-found: error
          retention-days: 14
