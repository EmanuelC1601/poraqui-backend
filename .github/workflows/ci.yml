name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Poraqui.sln
      - name: Build
        run: dotnet build Poraqui.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Poraqui.sln --configuration Release --no-build --no-restore
